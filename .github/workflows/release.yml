name: Portable release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Check release version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/ComponentLens/ComponentLens.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the project version' }
      - name: Build portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Smoke-test portable binary
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Persistence and restart integration regression
        shell: pwsh
        run: ./scripts/smoke-persistence.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/ComponentLens-*-win-x64.zip,dist/ComponentLens-*-win-x64.zip.sha256 | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --title "Component Lens $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

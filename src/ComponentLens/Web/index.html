<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>Component Lens — Altium 365</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Component Lens"><span class="brand-icon" aria-hidden="true">◈</span><span>component<span class="brand-light">lens</span><small>ALTIUM 365 WORKSPACE TOOLS</small></span></a>
    <div class="header-actions"><span class="local-badge"><i></i><span data-i18n="localSession"></span></span>
      <label class="sr-only" for="language" data-i18n="language"></label><select id="language" aria-label="Language"><option value="fr">FR · Français</option><option value="en">EN · English</option><option value="es">ES · Español</option></select>
      <button id="quit" class="button text-button" data-i18n="quit"></button>
    </div>
  </header>
  <main>
    <div class="page-heading"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><button id="demo" class="button secondary"><span aria-hidden="true">▷</span><span data-i18n="demo"></span></button></div>
    <section aria-labelledby="workspaces-heading">
      <h2 id="workspaces-heading" class="sr-only" data-i18n="workspaces"></h2>
      <div class="workspace-grid">
        <form class="workspace-card" id="form-a" autocomplete="off">
          <div class="card-heading"><span class="workspace-letter a">A</span><div><h2 data-i18n="workspaceA"></h2><p data-i18n="workspaceHint"></p></div><span id="status-a" class="connection-status" data-i18n="notConnected"></span></div>
          <label for="name-a" data-i18n="workspaceName"></label><input id="name-a" name="name" maxlength="100" data-i18n-placeholder="namePlaceholderA" spellcheck="false">
          <label for="endpoint-a" data-i18n="workspaceUrl"></label><input id="endpoint-a" name="endpoint" type="text" placeholder="https://workspace-a.365.altium.com" required spellcheck="false" autocapitalize="off">
          <div class="token-label"><label for="token-a" data-i18n="apiToken"></label><button type="button" class="text-link reveal" data-slot="a" data-i18n="showToken"></button></div>
          <div class="token-row"><input id="token-a" name="token" type="password" required placeholder="••••••••••••••••••••••••" autocomplete="new-password" spellcheck="false"><button class="button connect-button" type="submit"><span data-i18n="connect"></span><span aria-hidden="true">↗</span></button></div>
          <p id="note-a" class="connection-note" aria-live="polite" data-i18n="memoryOnly"></p>
        </form>
        <div class="workspace-link" aria-hidden="true">⇄</div>
        <form class="workspace-card" id="form-b" autocomplete="off">
          <div class="card-heading"><span class="workspace-letter b">B</span><div><h2 data-i18n="workspaceB"></h2><p data-i18n="workspaceHint"></p></div><span id="status-b" class="connection-status" data-i18n="notConnected"></span></div>
          <label for="name-b" data-i18n="workspaceName"></label><input id="name-b" name="name" maxlength="100" data-i18n-placeholder="namePlaceholderB" spellcheck="false">
          <label for="endpoint-b" data-i18n="workspaceUrl"></label><input id="endpoint-b" name="endpoint" type="text" placeholder="https://workspace-b.365.altium.com" required spellcheck="false" autocapitalize="off">
          <div class="token-label"><label for="token-b" data-i18n="apiToken"></label><button type="button" class="text-link reveal" data-slot="b" data-i18n="showToken"></button></div>
          <div class="token-row"><input id="token-b" name="token" type="password" required placeholder="••••••••••••••••••••••••" autocomplete="new-password" spellcheck="false"><button class="button connect-button" type="submit"><span data-i18n="connect"></span><span aria-hidden="true">↗</span></button></div>
          <p id="note-b" class="connection-note" aria-live="polite" data-i18n="memoryOnly"></p>
        </form>
      </div>
    </section>
    <div class="scan-bar"><div class="match-rule"><span class="rule-icon" aria-hidden="true">=</span><div><strong>Manufacturer <span>+</span> Manufacturer Part Number</strong><p data-i18n="matchHint"></p></div></div><div class="scan-actions"><label class="check-label"><input type="checkbox" id="ignore-case" checked><span data-i18n="normalize"></span></label><button id="scan" class="button primary" disabled><span aria-hidden="true">⌕</span><span data-i18n="scan"></span></button><button id="cancel" class="button secondary" hidden data-i18n="cancel"></button></div></div>
    <div id="notification" role="alert" hidden></div>
    <section id="progress-panel" class="progress-panel" hidden aria-live="polite"><div class="progress-heading"><strong data-i18n="scanInProgress"></strong><span data-i18n="readOnly"></span></div><div id="progress-lines"></div></section>
    <section class="results-layout" aria-labelledby="results-title">
      <aside class="filter-panel"><div class="filter-heading"><h2 data-i18n="categories"></h2><button id="clear-categories" class="text-link" data-i18n="reset"></button></div><p data-i18n="categoryHint"></p><label for="category-search" class="sr-only" data-i18n="searchCategories"></label><input type="search" id="category-search" data-i18n-placeholder="searchCategories"><div id="category-list" class="category-list"></div><div class="filter-footnote"><span aria-hidden="true">ⓘ</span><span data-i18n="categoryFootnote"></span></div></aside>
      <div class="results-main">
        <div id="demo-banner" class="demo-banner" hidden><span data-i18n="demoBanner"></span><button id="leave-demo" class="text-link" data-i18n="leaveDemo"></button></div>
        <div id="partial-banner" class="partial-banner" role="status" hidden></div>
        <section id="inventory-panel" class="inventory-panel" hidden aria-labelledby="inventory-title"><h2 id="inventory-title" data-i18n="inventoryTitle"></h2><div id="inventory-content"></div></section>
        <div class="metric-grid"><div class="metric"><span data-i18n="crossMatches"></span><strong id="metric-cross">—</strong><small data-i18n="identityGroups"></small></div><div class="metric"><span data-i18n="componentsA"></span><strong id="metric-a">—</strong><small id="metric-a-note" data-i18n="latestRevisions"></small></div><div class="metric"><span data-i18n="componentsB"></span><strong id="metric-b">—</strong><small id="metric-b-note" data-i18n="latestRevisions"></small></div><button id="quality" class="metric quality-metric"><span data-i18n="dataQuality"></span><strong id="metric-quality">—</strong><small data-i18n="missingIdentity"></small></button></div>
        <div class="result-panel"><div class="results-heading"><div><h2 id="results-title" data-i18n="results"></h2><p id="result-caption" data-i18n="resultsCaption"></p></div><div class="export-actions"><button id="export-csv" class="button small secondary" disabled>↓ CSV</button><button id="export-json" class="button small secondary" disabled>↓ JSON</button></div></div>
          <div class="table-toolbar"><div class="tabs" role="tablist" data-i18n-aria="scope"><button class="tab active" role="tab" aria-selected="true" data-scope="cross" data-i18n="scopeCross"></button><button class="tab" role="tab" aria-selected="false" data-scope="a" data-i18n="scopeA"></button><button class="tab" role="tab" aria-selected="false" data-scope="b" data-i18n="scopeB"></button><button class="tab" role="tab" aria-selected="false" data-scope="all" data-i18n="scopeAll"></button></div><label class="search-wrap"><span aria-hidden="true">⌕</span><span class="sr-only" data-i18n="searchResults"></span><input id="result-search" type="search" data-i18n-placeholder="searchResults"></label></div>
          <div id="result-content"></div><div id="pagination" class="pagination" hidden><span id="page-info"></span><div><button id="previous" class="button small secondary" data-i18n="previous"></button><button id="next" class="button small secondary" data-i18n="next"></button></div></div>
        </div>
        <section id="quality-panel" class="quality-panel" hidden><div class="filter-heading"><h2 data-i18n="qualityTitle"></h2><button id="close-quality" class="text-link" data-i18n="close"></button></div><p data-i18n="qualityHint"></p><div id="quality-content"></div><button id="export-issues" class="button small secondary" data-i18n="exportIssues"></button></section>
      </div>
    </section>
    <footer><span>Component Lens <span class="footer-version">v1.0.1</span></span><span data-i18n="footer"></span><a href="https://www.altium.com/documentation/altium-developer-center/altium-365/api" target="_blank" rel="noreferrer" data-i18n="apiDocs"></a></footer>
  </main>
</body>
</html>
